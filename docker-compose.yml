# docker compose up -d --build
# Put secrets (SESSION_SECRET, ADMIN_PASSWORD, BOT_TOKEN, payment keys …) into .env next to this file.
# NODE_ENV, PORT and DATA_DIR below always win over .env: inside the container they must stay as is.
services:
  app:
    build: .
    image: samo-coffee:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      # the paths inside the container are fixed by DATA_DIR; ignore local-development values from .env
      DATABASE_PATH: ""
      UPLOAD_DIR: ""
      # The app is reached through the reverse proxy on this host (see "Обратный прокси и HTTPS" in
      # the README), so its X-Forwarded-For is trusted. Set TRUST_PROXY=0 in .env if you publish the
      # port to the internet directly (not recommended).
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      # Loopback only: the container must not be reachable past the proxy — a direct client could
      # send its own X-Forwarded-For and bypass the rate limits. To expose it directly, change this
      # to "3000:3000" AND set TRUST_PROXY=0.
      - "127.0.0.1:3000:3000"
    volumes:
      # one volume keeps the SQLite database (/data/samo.db) and the uploaded media (/data/uploads)
      - samo-data:/data

volumes:
  samo-data:
