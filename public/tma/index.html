<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no">
  <title>Samo Coffee</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/tma/app.css">
  <!-- Official Telegram Mini App bridge (the only third-party script; allowed by the /tma CSP). -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/tma/js/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar" hidden>
      <button class="topbar__back" id="topbar-back" type="button" aria-label="Назад">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="topbar__title" id="topbar-title"></div>
    </header>

    <main class="view" id="view" tabindex="-1">
      <div class="splash" role="status" aria-label="Загрузка">
        <img class="splash__logo" src="/img/favicon.svg" alt="" width="72" height="72">
        <div class="splash__name">Samo <em>Coffee</em></div>
        <div class="splash__dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </main>

    <!-- Browser fallback for Telegram's MainButton (hidden inside Telegram). -->
    <div class="mainbar" id="mainbar" hidden>
      <button class="mainbar__btn" id="mainbar-btn" type="button"><span class="mainbar__spinner" aria-hidden="true"></span><span id="mainbar-text"></span></button>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Разделы" hidden></nav>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem;text-align:center">Для работы мини-приложения включите JavaScript.</p></noscript>
</body>
</html>
